name: TikTok 30-Minute LiveSphere Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:

      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            xvfb \
            xdotool \
            pulseaudio \
            pulseaudio-utils \
            wget \
            wmctrl

      - name: Install Google Chrome
        run: |
          set -eux

          wget -O /tmp/google-chrome.deb \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb

          sudo apt-get install -y /tmp/google-chrome.deb

          google-chrome --version

      - name: Start portrait display
        run: |
          set -eux

          export DISPLAY=:99

          Xvfb :99 \
            -screen 0 1080x1920x24 \
            -ac \
            +extension GLX \
            +render \
            -noreset \
            > /tmp/xvfb.log 2>&1 &

          echo $! > /tmp/xvfb.pid

          sleep 4

          echo "Display:"
          xdpyinfo | grep dimensions

      - name: Start virtual audio
        run: |
          set -eux

          pulseaudio \
            --start \
            --exit-idle-time=-1

          sleep 3

          pactl load-module \
            module-null-sink \
            sink_name=TikTokSink \
            sink_properties=device.description=TikTokSink

          pactl set-default-sink TikTokSink

          echo "Audio devices:"
          pactl list short sinks
          pactl list short sources

      - name: Launch LiveSphere webpage
        run: |
          set -eux

          export DISPLAY=:99

          google-chrome \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --disable-software-rasterizer \
            --disable-infobars \
            --disable-notifications \
            --start-maximized \
            --window-size=1080,1920 \
            --window-position=0,0 \
            --autoplay-policy=no-user-gesture-required \
            --user-data-dir=/tmp/livesphere-chrome \
            "https://livespherev3.gamer.gd/?i=1" \
            > /tmp/chrome.log 2>&1 &

          echo $! > /tmp/chrome.pid

          echo "Waiting for LiveSphere..."

          sleep 12

          echo "Chrome windows:"
          xdotool search --onlyvisible --name ".*" getwindowname %@ || true

          # Find Chrome's window and force it to fill
          # the complete 1080x1920 portrait display.
          WINDOW=$(xdotool search \
            --onlyvisible \
            --class "google-chrome" \
            2>/dev/null | head -n 1 || true)

          if [ -n "$WINDOW" ]; then
            echo "Chrome window: $WINDOW"

            xdotool windowactivate "$WINDOW"

            xdotool windowmove "$WINDOW" 0 0

            xdotool windowsize "$WINDOW" 1080 1920

            sleep 3
          else
            echo "Chrome window was not found."
          fi

      - name: Trigger webpage audio
        run: |
          set -eux

          export DISPLAY=:99

          sleep 3

          # Click the centre of the portrait page.
          # This is the interaction that should unlock
          # the webpage's sound.
          xdotool mousemove 540 960
          xdotool click 1

          echo "Initial webpage click completed."

          sleep 5

          echo "Audio sources after click:"
          pactl list short sink-inputs || true

      - name: Capture diagnostic screenshot
        run: |
          set -eux

          export DISPLAY=:99

          # Save a frame from the exact display FFmpeg will stream.
          ffmpeg \
            -y \
            -f x11grab \
            -video_size 1080x1920 \
            -i :99.0 \
            -frames:v 1 \
            /tmp/livesphere-preview.png

          echo "Preview captured."

      - name: Stream LiveSphere to Restream
        run: |
          set -euo pipefail

          RESTREAM_URL="rtmp://london.restream.io/live"

          # Put your Restream key here.
          RESTREAM_KEY="YOUR_RESTREAM_KEY"

          TARGET="${RESTREAM_URL%/}/${RESTREAM_KEY}"

          echo "========================================"
          echo "LIVE SPHERE STREAM"
          echo "========================================"
          echo "Resolution: 1080x1920"
          echo "Frame rate: 30 FPS"
          echo "Duration: 30 minutes"
          echo "Destination: $RESTREAM_URL"
          echo "========================================"

          ffmpeg \
            -hide_banner \
            -loglevel info \
            -f x11grab \
            -video_size 1080x1920 \
            -framerate 30 \
            -draw_mouse 0 \
            -i :99.0 \
            -f pulse \
            -i TikTokSink.monitor \
            -map 0:v:0 \
            -map 1:a:0 \
            -c:v libx264 \
            -preset ultrafast \
            -tune zerolatency \
            -pix_fmt yuv420p \
            -r 30 \
            -b:v 2500k \
            -maxrate 3000k \
            -bufsize 6000k \
            -g 60 \
            -keyint_min 60 \
            -sc_threshold 0 \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -ac 2 \
            -t 1800 \
            -f flv \
            "$TARGET"

      - name: Cleanup
        if: always()
        run: |
          kill "$(cat /tmp/chrome.pid)" 2>/dev/null || true
          kill "$(cat /tmp/xvfb.pid)" 2>/dev/null || true
          pulseaudio --kill 2>/dev/null || true
