      - name: Launch public webpage
        run: |
          set -eux
          export DISPLAY=:99

          # Clean old profile
          rm -rf /tmp/chrome-profile
          mkdir -p /tmp/chrome-profile

          google-chrome \
            --no-sandbox \
            --disable-dev-shm-usage \
            --use-gl=swiftshader \
            --disable-features=VizDisplayCompositor \
            --window-size=1080,1920 \
            --window-position=0,0 \
            --start-maximized \
            --kiosk \
            --autoplay-policy=no-user-gesture-required \
            --user-data-dir=/tmp/chrome-profile \
            "https://www.wikipedia.org/" &

          sleep 15

          # Bring Chrome to front and focus
          wmctrl -r :ACTIVE: -e 0,0,0,1080,1920 || true
          xdotool mousemove 540 960 click 1
          sleep 2

      - name: Debug screenshot (to see what ffmpeg sees)
        run: |
          export DISPLAY=:99
          sudo apt-get install -y imagemagick
          sleep 2
          import -window root /tmp/screen.png
          ls -lh /tmp/screen.png
