```yaml
name: Public Website 3-Minute Restream Test

"on":
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DISPLAY: :99
      SCREEN_WIDTH: 1080
      SCREEN_HEIGHT: 1920
      SCREEN_FPS: 30
      PULSE_SINK: TikTokSink

    steps:

      # =========================================================
      # 1. Install dependencies
      # =========================================================
      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            xvfb \
            openbox \
            xdotool \
            pulseaudio \
            pulseaudio-utils \
            wget \
            x11-utils \
            imagemagick \
            curl \
            jq

      # =========================================================
      # 2. Install Google Chrome
      # =========================================================
      - name: Install Google Chrome
        run: |
          set -eux

          wget -O /tmp/chrome.deb \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb

          sudo apt-get install -y /tmp/chrome.deb

          google-chrome --version

      # =========================================================
      # 3. Start virtual display
      # =========================================================
      - name: Start virtual display
        run: |
          set -eux

          export DISPLAY=:99

          Xvfb :99 \
            -screen 0 1080x1920x24 \
            -ac \
            +extension GLX \
            +extension RANDR \
            +render \
            -noreset \
            >/tmp/xvfb.log 2>&1 &

          sleep 5

          echo "DISPLAY:"
          xdpyinfo -display :99 | grep dimensions

          xset -display :99 s off || true
          xset -display :99 -dpms || true
          xset -display :99 s noblank || true

          openbox \
            --config-file /etc/xdg/openbox/rc.xml \
            >/tmp/openbox.log 2>&1 &

          sleep 4

          echo "Openbox:"
          pgrep -a openbox || true

      # =========================================================
      # 4. Start virtual audio
      # =========================================================
      - name: Start virtual audio
        run: |
          set -eux

          pulseaudio \
            --start \
            --exit-idle-time=-1 \
            --daemonize=true

          sleep 4

          pactl load-module \
            module-null-sink \
            sink_name=TikTokSink \
            sink_properties=device.description=TikTokSink

          pactl set-default-sink TikTokSink

          echo "===== SINKS ====="
          pactl list short sinks

          echo "===== SOURCES ====="
          pactl list short sources

          echo "===== DEFAULT ====="
          pactl get-default-sink

          echo "===== MONITOR ====="
          pactl list short sources | grep "TikTokSink.monitor"

      # =========================================================
      # 5. Launch Chrome with DevTools
      # =========================================================
      - name: Launch Chrome renderer
        run: |
          set -eux

          export DISPLAY=:99
          export PULSE_SINK=TikTokSink

          rm -rf /tmp/chrome-profile

          google-chrome \
            --no-sandbox \
            --disable-dev-shm-usage \
            --no-first-run \
            --no-default-browser-check \
            --disable-infobars \
            --disable-session-crashed-bubble \
            --disable-popup-blocking \
            \
            --autoplay-policy=no-user-gesture-required \
            \
            --disable-background-timer-throttling \
            --disable-backgrounding-occluded-windows \
            --disable-renderer-backgrounding \
            --disable-features=CalculateNativeWinOcclusion,IntensiveWakeUpThrottling \
            \
            --enable-webgl \
            --enable-gpu-rasterization \
            --enable-zero-copy \
            \
            --force-device-scale-factor=1 \
            --window-size=1080,1920 \
            --window-position=0,0 \
            --start-maximized \
            --kiosk \
            \
            --remote-debugging-port=9222 \
            --remote-debugging-address=127.0.0.1 \
            \
            --user-data-dir=/tmp/chrome-profile \
            --ignore-certificate-errors \
            \
            "https://livespherev3.gamer.gd/?i=1" \
            >/tmp/chrome.log 2>&1 &

          echo "Waiting for Chrome DevTools..."

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9222/json >/tmp/chrome-tabs.json; then
              echo "Chrome DevTools is ready."
              break
            fi
            sleep 1
          done

          cat /tmp/chrome-tabs.json

          sleep 15

      # =========================================================
      # 6. Find Chrome window and focus it
      # =========================================================
      - name: Focus Chrome renderer
        run: |
          set -eux

          export DISPLAY=:99

          CHROME_WINDOW=$(xdotool search \
            --onlyvisible \
            --class "google-chrome" \
            | head -n 1)

          if [ -z "$CHROME_WINDOW" ]; then
            echo "Chrome window not found."
            cat /tmp/chrome.log || true
            exit 1
          fi

          echo "Chrome window: $CHROME_WINDOW"

          xdotool windowmove "$CHROME_WINDOW" 0 0 || true
          xdotool windowactivate "$CHROME_WINDOW" || true

          sleep 3

          xdotool mousemove 540 960
          xdotool click 1 || true

          sleep 5

          echo "Geometry:"
          xdotool getwindowgeometry "$CHROME_WINDOW"

      # =========================================================
      # 7. Inspect the webpage through Chrome DevTools
      # =========================================================
      - name: Inspect JavaScript renderer
        run: |
          set -eux

          echo "========================================"
          echo "CHROME TABS"
          echo "========================================"

          cat /tmp/chrome-tabs.json

          DEBUG_URL=$(jq -r '
            .[]
            | select(.type=="page")
            | .webSocketDebuggerUrl
          ' /tmp/chrome-tabs.json | head -n 1)

          if [ -z "$DEBUG_URL" ] || [ "$DEBUG_URL" = "null" ]; then
            echo "ERROR: Could not find Chrome DevTools websocket."
            exit 1
          fi

          echo "DevTools endpoint found."

          # Install a small WebSocket client.
          python3 -m pip install --quiet websocket-client

          cat >/tmp/inspect_chrome.py <<'PY'
          import json
          import time
          import websocket

          url = open("/tmp/debug_url").read().strip()

          ws = websocket.create_connection(url, timeout=10)

          counter = 0

          def command(method, params=None):
              global counter

              counter += 1

              message = {
                  "id": counter,
                  "method": method
              }

              if params is not None:
                  message["params"] = params

              ws.send(json.dumps(message))

              while True:
                  response = json.loads(ws.recv())

                  if response.get("id") == counter:
                      return response

          # Enable runtime.
          print("Enabling Runtime...")
          print(command("Runtime.enable"))

          # Enable Page.
          print("Enabling Page...")
          print(command("Page.enable"))

          # Make the tab visible to Chrome's page lifecycle.
          print("Setting lifecycle events...")
          print(command("Page.setWebLifecycleState", {
              "state": "active"
          }))

          # Inspect the application.
          expression = r"""
          (() => {
              const result = {};

              result.url = location.href;
              result.visibilityState = document.visibilityState;
              result.hidden = document.hidden;
              result.readyState = document.readyState;

              result.engineRunning =
                  window.__LiveSphereEngineRunning ?? null;

              result.frameCounter =
                  window.__LiveSphereFrameCounter ?? null;

              result.stageInitialized =
                  window.__LiveSphereStageInitialized ?? null;

              result.viewerCount =
                  document.querySelectorAll(".viewer").length;

              result.canvasCount =
                  document.querySelectorAll("canvas").length;

              result.bodyChildren =
                  document.body ? document.body.children.length : 0;

              result.audioCount =
                  document.querySelectorAll("audio").length;

              result.videoCount =
                  document.querySelectorAll("video").length;

              result.title =
                  document.title;

              return JSON.stringify(result);
          })()
          """

          print("========================================")
          print("PAGE RUNTIME STATE")
          print("========================================")

          result = command("Runtime.evaluate", {
              "expression": expression,
              "returnByValue": True,
              "awaitPromise": True
          })

          print(json.dumps(result, indent=2))

          # Give the renderer time to advance.
          time.sleep(5)

          print("========================================")
          print("PAGE RUNTIME STATE AFTER 5 SECONDS")
          print("========================================")

          result2 = command("Runtime.evaluate", {
              "expression": expression,
              "returnByValue": True,
              "awaitPromise": True
          })

          print(json.dumps(result2, indent=2))

          ws.close()
          PY

          printf '%s' "$DEBUG_URL" >/tmp/debug_url

          python3 /tmp/inspect_chrome.py

      # =========================================================
      # 8. Force page lifecycle active + trigger rendering
      # =========================================================
      - name: Activate webpage renderer
        run: |
          set -eux

          DEBUG_URL=$(cat /tmp/debug_url)

          cat >/tmp/activate_chrome.py <<'PY'
          import json
          import time
          import websocket

          url = open("/tmp/debug_url").read().strip()
          ws = websocket.create_connection(url, timeout=10)

          counter = 0

          def command(method, params=None):
              global counter

              counter += 1

              message = {
                  "id": counter,
                  "method": method
              }

              if params is not None:
                  message["params"] = params

              ws.send(json.dumps(message))

              while True:
                  response = json.loads(ws.recv())

                  if response.get("id") == counter:
                      return response

          command("Runtime.enable")
          command("Page.enable")

          command("Page.setWebLifecycleState", {
              "state": "active"
          })

          # This does NOT modify the hosted website.
          # It only asks Chrome to evaluate runtime checks.
          expression = r"""
          (() => {
              document.documentElement.style.setProperty(
                  "--github-renderer-active",
                  "1"
              );

              return {
                  visibility: document.visibilityState,
                  hidden: document.hidden,
                  raf: typeof requestAnimationFrame,
                  performanceNow: typeof performance.now
              };
          })()
          """

          print(command("Runtime.evaluate", {
              "expression": expression,
              "returnByValue": True
          }))

          time.sleep(2)

          ws.close()
          PY

          python3 -m pip install --quiet websocket-client

          python3 /tmp/activate_chrome.py

      # =========================================================
      # 9. Wait for renderer
      # =========================================================
      - name: Warm up renderer
        run: |
          set -eux

          export DISPLAY=:99

          echo "Warming up webpage..."

          sleep 20

          echo "Chrome processes:"
          pgrep -a chrome || true

          echo "Display:"
          xdpyinfo -display :99 | grep dimensions

      # =========================================================
      # 10. Capture diagnostic screenshots
      # =========================================================
      - name: Capture renderer diagnostics
        run: |
          set -eux

          export DISPLAY=:99

          echo "Capturing first frame..."

          import \
            -display :99 \
            -window root \
            /tmp/webpage-before.png

          sleep 3

          echo "Capturing second frame..."

          import \
            -display :99 \
            -window root \
            /tmp/webpage-after.png

          identify \
            /tmp/webpage-before.png \
            /tmp/webpage-after.png

      # =========================================================
      # 11. Upload diagnostic frames
      # =========================================================
      - name: Upload renderer diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: renderer-diagnostics
          path: |
            /tmp/webpage-before.png
            /tmp/webpage-after.png
            /tmp/chrome.log
            /tmp/xvfb.log
            /tmp/openbox.log
          if-no-files-found: error

      # =========================================================
      # 12. Verify PulseAudio
      # =========================================================
      - name: Verify audio pipeline
        run: |
          set -eux

          echo "===== AUDIO SINKS ====="
          pactl list short sinks

          echo "===== AUDIO SOURCES ====="
          pactl list short sources

          echo "===== DEFAULT SINK ====="
          pactl get-default-sink

          echo "===== AUDIO MONITOR ====="
          pactl list short sources | grep "TikTokSink.monitor"

          echo "===== FIVE SECOND AUDIO TEST ====="

          timeout 5 ffmpeg \
            -hide_banner \
            -loglevel info \
            -f pulse \
            -i TikTokSink.monitor \
            -af volumedetect \
            -f null \
            - \
            2>&1 | tee /tmp/audio-test.log || true

          echo "===== AUDIO TEST RESULT ====="

          cat /tmp/audio-test.log || true

      # =========================================================
      # 13. Stream to Restream
      # =========================================================
      - name: Stream to Restream
        run: |
          set -euo pipefail

          export DISPLAY=:99
          export PULSE_SINK=TikTokSink

          RESTREAM_URL="rtmp://london.restream.io/live"

          RESTREAM_KEY="re_12262857_eventb998ec2e79c64f8e978759c2b52fe02c"

          TARGET="${RESTREAM_URL%/}/${RESTREAM_KEY}"

          echo "========================================"
          echo "PUBLIC WEBSITE RESTREAM TEST"
          echo "========================================"
          echo "Website: https://livespherev3.gamer.gd/?i=1"
          echo "Resolution: 1080x1920"
          echo "FPS: 30"
          echo "Duration: 3 minutes"
          echo "========================================"

          ffmpeg \
            -hide_banner \
            -loglevel info \
            \
            -f x11grab \
            -draw_mouse 0 \
            -framerate 30 \
            -video_size 1080x1920 \
            -i :99.0 \
            \
            -f pulse \
            -i TikTokSink.monitor \
            \
            -map 0:v:0 \
            -map 1:a:0 \
            \
            -c:v libx264 \
            -preset ultrafast \
            -tune zerolatency \
            -pix_fmt yuv420p \
            \
            -r 30 \
            -b:v 2500k \
            -maxrate 3000k \
            -bufsize 6000k \
            \
            -g 60 \
            -keyint_min 60 \
            -sc_threshold 0 \
            \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -ac 2 \
            \
            -t 180 \
            \
            -f flv \
            "$TARGET"
```
