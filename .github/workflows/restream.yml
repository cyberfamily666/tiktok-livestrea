name: TikTok 30-Minute Restream Test

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:

      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            xvfb \
            xdotool \
            pulseaudio \
            pulseaudio-utils \
            wget \
            imagemagick

      - name: Install Google Chrome
        run: |
          set -eux

          wget -O /tmp/chrome.deb \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb

          sudo apt-get install -y /tmp/chrome.deb

          google-chrome --version

      - name: Start virtual display
        run: |
          set -eux

          export DISPLAY=:99

          Xvfb :99 \
            -screen 0 1080x1920x24 \
            -ac \
            +extension GLX \
            +render \
            -noreset \
            > /tmp/xvfb.log 2>&1 &

          sleep 4

          echo "Display:"
          xdpyinfo | grep dimensions

      - name: Start virtual audio
        run: |
          set -eux

          pulseaudio \
            --start \
            --exit-idle-time=-1

          sleep 3

          pactl load-module \
            module-null-sink \
            sink_name=TikTokSink \
            sink_properties=device.description=TikTokSink

          pactl set-default-sink TikTokSink

          pactl list short sinks
          pactl list short sources

      - name: Launch LiveSphere
        run: |
          set -eux

          export DISPLAY=:99

          google-chrome \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --disable-software-rasterizer \
            --window-size=1080,1920 \
            --window-position=0,0 \
            --autoplay-policy=no-user-gesture-required \
            --user-data-dir=/tmp/chrome-profile \
            "https://livespherev3.gamer.gd/?i=1" \
            > /tmp/chrome.log 2>&1 &

          CHROME_PID=$!

          echo "$CHROME_PID" > /tmp/chrome.pid

          echo "Chrome PID: $CHROME_PID"
          echo "Waiting for LiveSphere..."
          sleep 15

          echo "========================================"
          echo "CHROME VERSION"
          echo "========================================"

          google-chrome --version

          echo "========================================"
          echo "CHROME PROCESS"
          echo "========================================"

          ps -p "$CHROME_PID" -f || true

          echo "========================================"
          echo "CHROME LOG"
          echo "========================================"

          cat /tmp/chrome.log || true

          echo "========================================"
          echo "VISIBLE WINDOWS"
          echo "========================================"

          xdotool search --onlyvisible --name ".*" \
            getwindowname %@ || true

          echo "========================================"
          echo "TRIGGERING PAGE CLICK"
          echo "========================================"

          xdotool mousemove 540 960
          xdotool click 1

          sleep 5

          echo "========================================"
          echo "AUDIO CONNECTIONS"
          echo "========================================"

          pactl list short sink-inputs || true

          echo "========================================"
          echo "CAPTURING CURRENT DISPLAY"
          echo "========================================"

          import -display :99 -window root /tmp/livesphere-preview.png

          echo "Preview saved to /tmp/livesphere-preview.png"

      - name: Stream to Restream
        run: |
          set -euo pipefail

          RESTREAM_URL="rtmp://london.restream.io/live"

          # Keep your current Restream key here locally.
          RESTREAM_KEY="YOUR_RESTREAM_KEY"

          TARGET="${RESTREAM_URL%/}/${RESTREAM_KEY}"

          echo "========================================"
          echo "STARTING 30 MINUTE STREAM"
          echo "========================================"
          echo "Resolution: 1080x1920"
          echo "FPS: 30"
          echo "Duration: 1800 seconds"
          echo "========================================"

          ffmpeg \
            -hide_banner \
            -loglevel info \
            -f x11grab \
            -video_size 1080x1920 \
            -framerate 30 \
            -draw_mouse 0 \
            -i :99.0 \
            -f pulse \
            -i TikTokSink.monitor \
            -map 0:v:0 \
            -map 1:a:0 \
            -c:v libx264 \
            -preset ultrafast \
            -tune zerolatency \
            -pix_fmt yuv420p \
            -r 30 \
            -b:v 2500k \
            -maxrate 3000k \
            -bufsize 6000k \
            -g 60 \
            -keyint_min 60 \
            -sc_threshold 0 \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -ac 2 \
            -t 1800 \
            -f flv \
            "$TARGET"

      - name: Cleanup
        if: always()
        run: |
          if [ -f /tmp/chrome.pid ]; then
            kill "$(cat /tmp/chrome.pid)" 2>/dev/null || true
          fi

          pulseaudio --kill 2>/dev/null || true
