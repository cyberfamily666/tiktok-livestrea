```yaml
name: Public Website 3-Minute Restream Test

"on":
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DISPLAY: :99
      PULSE_SINK: TikTokSink

    steps:

      # =========================================================
      # 1. INSTALL DEPENDENCIES
      # =========================================================
      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            xvfb \
            openbox \
            xdotool \
            pulseaudio \
            pulseaudio-utils \
            wget \
            x11-utils \
            imagemagick \
            curl \
            jq \
            python3 \
            python3-pip

      # =========================================================
      # 2. INSTALL GOOGLE CHROME
      # =========================================================
      - name: Install Google Chrome
        run: |
          set -eux

          wget -O /tmp/chrome.deb \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb

          sudo apt-get install -y /tmp/chrome.deb

          google-chrome --version

      # =========================================================
      # 3. START VIRTUAL DISPLAY
      # =========================================================
      - name: Start virtual display
        run: |
          set -eux

          export DISPLAY=:99

          Xvfb :99 \
            -screen 0 1080x1920x24 \
            -ac \
            +extension GLX \
            +extension RANDR \
            +render \
            -noreset \
            >/tmp/xvfb.log 2>&1 &

          sleep 5

          echo "Display:"
          xdpyinfo -display :99 | grep dimensions

          xset -display :99 s off || true
          xset -display :99 -dpms || true
          xset -display :99 s noblank || true

          openbox \
            --config-file /etc/xdg/openbox/rc.xml \
            >/tmp/openbox.log 2>&1 &

          sleep 4

      # =========================================================
      # 4. START VIRTUAL AUDIO
      # =========================================================
      - name: Start virtual audio
        run: |
          set -eux

          pulseaudio \
            --start \
            --exit-idle-time=-1 \
            --daemonize=true

          sleep 4

          pactl load-module \
            module-null-sink \
            sink_name=TikTokSink \
            sink_properties=device.description=TikTokSink

          pactl set-default-sink TikTokSink

          echo "Sinks:"
          pactl list short sinks

          echo "Sources:"
          pactl list short sources

          echo "Default:"
          pactl get-default-sink

      # =========================================================
      # 5. LAUNCH CHROME
      # =========================================================
      - name: Launch Chrome renderer
        run: |
          set -eux

          export DISPLAY=:99
          export PULSE_SINK=TikTokSink

          rm -rf /tmp/chrome-profile

          google-chrome \
            --no-sandbox \
            --disable-dev-shm-usage \
            --no-first-run \
            --no-default-browser-check \
            --disable-infobars \
            --disable-session-crashed-bubble \
            --disable-popup-blocking \
            \
            --autoplay-policy=no-user-gesture-required \
            \
            --disable-background-timer-throttling \
            --disable-backgrounding-occluded-windows \
            --disable-renderer-backgrounding \
            --disable-features=CalculateNativeWinOcclusion,IntensiveWakeUpThrottling,BackForwardCache \
            \
            --enable-webgl \
            --enable-gpu-rasterization \
            --enable-zero-copy \
            \
            --force-device-scale-factor=1 \
            --window-size=1080,1920 \
            --window-position=0,0 \
            --start-maximized \
            \
            --remote-debugging-port=9222 \
            --remote-debugging-address=127.0.0.1 \
            \
            --user-data-dir=/tmp/chrome-profile \
            --ignore-certificate-errors \
            \
            "https://livespherev3.gamer.gd/?i=1" \
            >/tmp/chrome.log 2>&1 &

          echo "Waiting for Chrome..."

          for i in $(seq 1 30); do
            if curl -fsS \
              http://127.0.0.1:9222/json \
              >/tmp/chrome-tabs.json; then

              echo "Chrome DevTools ready."
              break
            fi

            sleep 1
          done

          if [ ! -s /tmp/chrome-tabs.json ]; then
            echo "Chrome failed to start."

            cat /tmp/chrome.log || true

            exit 1
          fi

          sleep 20

          cat /tmp/chrome-tabs.json

      # =========================================================
      # 6. FOCUS CHROME
      # =========================================================
      - name: Focus browser
        run: |
          set -eux

          export DISPLAY=:99

          CHROME_WINDOW=$(xdotool search \
            --onlyvisible \
            --class "google-chrome" \
            | head -n 1)

          if [ -z "$CHROME_WINDOW" ]; then
            echo "Chrome window not found."

            cat /tmp/chrome.log || true

            exit 1
          fi

          echo "Chrome window: $CHROME_WINDOW"

          xdotool windowmove "$CHROME_WINDOW" 0 0 || true

          xdotool windowactivate "$CHROME_WINDOW" || true

          sleep 3

          xdotool mousemove 540 960

          xdotool click 1 || true

          sleep 5

          xdotool getwindowgeometry "$CHROME_WINDOW"

      # =========================================================
      # 7. GET DEVTOOLS WEBSOCKET
      # =========================================================
      - name: Prepare DevTools
        run: |
          set -eux

          jq -r '
            .[]
            | select(.type=="page")
            | .webSocketDebuggerUrl
          ' /tmp/chrome-tabs.json \
            | head -n 1 \
            >/tmp/debug_url

          DEBUG_URL=$(cat /tmp/debug_url)

          if [ -z "$DEBUG_URL" ] || [ "$DEBUG_URL" = "null" ]; then
            echo "No Chrome DevTools websocket found."
            exit 1
          fi

          echo "DevTools endpoint ready."

      # =========================================================
      # 8. INSTALL WEBSOCKET CLIENT
      # =========================================================
      - name: Install Python DevTools client
        run: |
          set -eux

          python3 -m pip install \
            --quiet \
            --break-system-packages \
            websocket-client

      # =========================================================
      # 9. DEEP JAVASCRIPT DIAGNOSTIC
      # =========================================================
      - name: Diagnose JavaScript and animation
        run: |
          set -eux

          cat >/tmp/browser_diagnostic.py <<'PY'
          import json
          import time
          import websocket
          import sys

          url = open("/tmp/debug_url").read().strip()

          ws = websocket.create_connection(
              url,
              timeout=20
          )

          command_id = 0

          console_messages = []
          exceptions = []

          def command(method, params=None):

              global command_id

              command_id += 1

              msg = {
                  "id": command_id,
                  "method": method
              }

              if params is not None:
                  msg["params"] = params

              ws.send(json.dumps(msg))

              while True:

                  response = json.loads(ws.recv())

                  if "method" in response:

                      if response["method"] == "Runtime.consoleAPICalled":
                          console_messages.append(response)

                      if response["method"] == "Runtime.exceptionThrown":
                          exceptions.append(response)

                  if response.get("id") == command_id:
                      return response

          # -----------------------------------------------------
          # Enable DevTools domains
          # -----------------------------------------------------

          command("Runtime.enable")
          command("Page.enable")
          command("Log.enable")

          # -----------------------------------------------------
          # Make Chrome treat page as active
          # -----------------------------------------------------

          command(
              "Page.setWebLifecycleState",
              {
                  "state": "active"
              }
          )

          command(
              "Emulation.setFocusEmulationEnabled",
              {
                  "enabled": True
              }
          )

          # -----------------------------------------------------
          # First JS test
          # -----------------------------------------------------

          test_expression = r"""
          (() => {

              const result = {};

              result.javascript =
                  true;

              result.timestamp =
                  Date.now();

              result.url =
                  location.href;

              result.readyState =
                  document.readyState;

              result.visibilityState =
                  document.visibilityState;

              result.hidden =
                  document.hidden;

              result.requestAnimationFrame =
                  typeof requestAnimationFrame === "function";

              result.performance =
                  typeof performance !== "undefined";

              result.scripts =
                  document.scripts.length;

              result.styles =
                  document.styleSheets.length;

              result.canvasCount =
                  document.querySelectorAll("canvas").length;

              result.viewerCount =
                  document.querySelectorAll(".viewer").length;

              result.audioCount =
                  document.querySelectorAll("audio").length;

              result.videoCount =
                  document.querySelectorAll("video").length;

              result.engineRunning =
                  window.__LiveSphereEngineRunning ?? null;

              result.frameCounter =
                  window.__LiveSphereFrameCounter ?? null;

              result.stageInitialized =
                  window.__LiveSphereStageInitialized ?? null;

              return result;

          })()
          """

          first = command(
              "Runtime.evaluate",
              {
                  "expression": test_expression,
                  "returnByValue": True,
                  "awaitPromise": True
              }
          )

          print("")
          print("========================================")
          print("INITIAL JAVASCRIPT STATE")
          print("========================================")
          print(
              json.dumps(
                  first,
                  indent=2
              )
          )

          # -----------------------------------------------------
          # Wait
          # -----------------------------------------------------

          print("")
          print("Waiting 5 seconds for animation frames...")

          time.sleep(5)

          # -----------------------------------------------------
          # Second JS test
          # -----------------------------------------------------

          second_expression = r"""
          (() => {

              return {

                  javascript:
                      true,

                  timestamp:
                      Date.now(),

                  readyState:
                      document.readyState,

                  visibilityState:
                      document.visibilityState,

                  hidden:
                      document.hidden,

                  engineRunning:
                      window.__LiveSphereEngineRunning ?? null,

                  frameCounter:
                      window.__LiveSphereFrameCounter ?? null,

                  stageInitialized:
                      window.__LiveSphereStageInitialized ?? null,

                  canvasCount:
                      document.querySelectorAll("canvas").length,

                  viewerCount:
                      document.querySelectorAll(".viewer").length,

                  audioCount:
                      document.querySelectorAll("audio").length

              };

          })()
          """

          second = command(
              "Runtime.evaluate",
              {
                  "expression": second_expression,
                  "returnByValue": True,
                  "awaitPromise": True
              }
          )

          print("")
          print("========================================")
          print("JAVASCRIPT STATE AFTER 5 SECONDS")
          print("========================================")
          print(
              json.dumps(
                  second,
                  indent=2
              )
          )

          # -----------------------------------------------------
          # Check requestAnimationFrame directly
          # -----------------------------------------------------

          raf_expression = r"""
          new Promise(resolve => {

              const start =
                  performance.now();

              requestAnimationFrame(() => {

                  resolve({
                      rafExecuted: true,
                      elapsed:
                          performance.now() - start
                  });

              });

          })
          """

          raf = command(
              "Runtime.evaluate",
              {
                  "expression": raf_expression,
                  "returnByValue": True,
                  "awaitPromise": True
              }
          )

          print("")
          print("========================================")
          print("REQUESTANIMATIONFRAME TEST")
          print("========================================")
          print(
              json.dumps(
                  raf,
                  indent=2
              )
          )

          # -----------------------------------------------------
          # Check common JS errors
          # -----------------------------------------------------

          errors_expression = r"""
          (() => {

              return {

                  errorCount:
                      window.__githubErrorCount ?? null,

                  bodyTextLength:
                      document.body
                          ? document.body.innerText.length
                          : 0,

                  bodyHTMLLength:
                      document.body
                          ? document.body.innerHTML.length
                          : 0

              };

          })()
          """

          errors = command(
              "Runtime.evaluate",
              {
                  "expression": errors_expression,
                  "returnByValue": True
              }
          )

          print("")
          print("========================================")
          print("PAGE ERROR / DOM TEST")
          print("========================================")
          print(
              json.dumps(
                  errors,
                  indent=2
              )
          )

          print("")
          print("========================================")
          print("DEVTOOLS EXCEPTIONS")
          print("========================================")

          print(
              json.dumps(
                  exceptions,
                  indent=2
              )
          )

          ws.close()
          PY

          python3 /tmp/browser_diagnostic.py \
            2>&1 \
            | tee /tmp/browser-diagnostic.log

      # =========================================================
      # 10. CAPTURE FIRST SCREEN
      # =========================================================
      - name: Capture first renderer frame
        run: |
          set -eux

          export DISPLAY=:99

          import \
            -display :99 \
            -window root \
            /tmp/frame-01.png

          identify /tmp/frame-01.png

      # =========================================================
      # 11. WAIT FOR ANIMATION
      # =========================================================
      - name: Wait for visual animation
        run: |
          set -eux

          export DISPLAY=:99

          echo "Waiting 8 seconds..."

          sleep 8

      # =========================================================
      # 12. CAPTURE SECOND SCREEN
      # =========================================================
      - name: Capture second renderer frame
        run: |
          set -eux

          export DISPLAY=:99

          import \
            -display :99 \
            -window root \
            /tmp/frame-02.png

          identify /tmp/frame-02.png

      # =========================================================
      # 13. COMPARE ACTUAL RENDERED FRAMES
      # =========================================================
      - name: Compare rendered frames
        run: |
          set -eux

          echo "========================================"
          echo "COMPARING RENDERED FRAMES"
          echo "========================================"

          COMPARE_OUTPUT=$(
            compare \
              -metric AE \
              /tmp/frame-01.png \
              /tmp/frame-02.png \
              /tmp/frame-difference.png \
              2>&1 || true
          )

          echo "Pixel difference:"
          echo "$COMPARE_OUTPUT"

          echo "Creating difference statistics..."

          identify \
            /tmp/frame-difference.png \
            || true

          echo "Frame comparison completed."

      # =========================================================
      # 14. UPLOAD ALL DIAGNOSTICS
      # =========================================================
      - name: Upload renderer diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: renderer-diagnostics
          path: |
            /tmp/frame-01.png
            /tmp/frame-02.png
            /tmp/frame-difference.png
            /tmp/browser-diagnostic.log
            /tmp/chrome.log
            /tmp/xvfb.log
            /tmp/openbox.log
            /tmp/audio-test.log
          if-no-files-found: warn

      # =========================================================
      # 15. AUDIO TEST
      # =========================================================
      - name: Test audio monitor
        run: |
          set -eux

          echo "========================================"
          echo "AUDIO DEVICES"
          echo "========================================"

          pactl list short sinks
          pactl list short sources

          echo "========================================"
          echo "AUDIO MONITOR TEST"
          echo "========================================"

          timeout 5 \
            ffmpeg \
              -hide_banner \
              -loglevel info \
              -f pulse \
              -i TikTokSink.monitor \
              -af volumedetect \
              -f null \
              - \
              2>&1 \
            | tee /tmp/audio-test.log \
            || true

      # =========================================================
      # 16. FINAL RESTREAM
      # =========================================================
      - name: Stream to Restream
        run: |
          set -euo pipefail

          export DISPLAY=:99
          export PULSE_SINK=TikTokSink

          RESTREAM_URL="rtmp://london.restream.io/live"

          RESTREAM_KEY="re_12262857_eventb998ec2e79c64f8e978759c2b52fe02c"

          TARGET="${RESTREAM_URL%/}/${RESTREAM_KEY}"

          echo "========================================"
          echo "PUBLIC WEBSITE RESTREAM TEST"
          echo "========================================"
          echo "Website: https://livespherev3.gamer.gd/?i=1"
          echo "Resolution: 1080x1920"
          echo "FPS: 30"
          echo "Duration: 3 minutes"
          echo "========================================"

          echo "Display:"
          xdpyinfo -display :99 | grep dimensions

          echo "Audio:"
          pactl list short sources | grep "TikTokSink.monitor"

          echo "Starting FFmpeg..."

          ffmpeg \
            -hide_banner \
            -loglevel info \
            \
            -f x11grab \
            -draw_mouse 0 \
            -framerate 30 \
            -video_size 1080x1920 \
            -i :99.0 \
            \
            -f pulse \
            -i TikTokSink.monitor \
            \
            -map 0:v:0 \
            -map 1:a:0 \
            \
            -c:v libx264 \
            -preset ultrafast \
            -tune zerolatency \
            -pix_fmt yuv420p \
            \
            -r 30 \
            -b:v 2500k \
            -maxrate 3000k \
            -bufsize 6000k \
            \
            -g 60 \
            -keyint_min 60 \
            -sc_threshold 0 \
            \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -ac 2 \
            \
            -t 180 \
            -f flv \
            "$TARGET"
```
