name: Public Website 3-Minute Restream Test

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      # ---------------------------------------------------------
      # 1. Install dependencies
      # ---------------------------------------------------------
      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            xvfb \
            xdotool \
            pulseaudio \
            pulseaudio-utils \
            wget \
            x11-utils

      # ---------------------------------------------------------
      # 2. Install Google Chrome
      # ---------------------------------------------------------
      - name: Install Google Chrome
        run: |
          set -eux

          wget -O /tmp/chrome.deb \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb

          sudo apt-get install -y /tmp/chrome.deb

          google-chrome --version

      # ---------------------------------------------------------
      # 3. Start virtual display
      # ---------------------------------------------------------
      - name: Start virtual display
        run: |
          set -eux

          export DISPLAY=:99

          Xvfb :99 \
            -screen 0 1080x1920x24 \
            -ac \
            +extension GLX \
            +render \
            -noreset &

          sleep 4

          echo "Virtual display:"
          xdpyinfo -display :99 | grep dimensions

      # ---------------------------------------------------------
      # 4. Start virtual audio
      # ---------------------------------------------------------
      - name: Start virtual audio
        run: |
          set -eux

          pulseaudio \
            --start \
            --exit-idle-time=-1

          sleep 3

          pactl load-module \
            module-null-sink \
            sink_name=TikTokSink \
            sink_properties=device.description=TikTokSink

          pactl set-default-sink TikTokSink

          echo "Audio sinks:"
          pactl list short sinks

          echo "Audio sources:"
          pactl list short sources

      # ---------------------------------------------------------
      # 5. Launch public webpage
      # ---------------------------------------------------------
      - name: Launch public webpage
        run: |
          set -eux

          export DISPLAY=:99

          google-chrome \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --disable-software-rasterizer \
            --start-maximized \
            --window-size=1080,1920 \
            --window-position=0,0 \
            --force-device-scale-factor=1 \
            --high-dpi-support=1 \
            --autoplay-policy=no-user-gesture-required \
            --disable-infobars \
            --disable-session-crashed-bubble \
            --user-data-dir=/tmp/chrome-profile \
            "https://www.wikipedia.org/" &

          echo "Waiting for Chrome..."
          sleep 12

          echo "Finding Chrome window..."

          CHROME_WINDOW=$(xdotool search \
            --onlyvisible \
            --class "google-chrome" \
            | head -n 1)

          if [ -z "$CHROME_WINDOW" ]; then
            echo "ERROR: Chrome window not found"
            exit 1
          fi

          echo "Chrome window ID: $CHROME_WINDOW"

          xdotool windowmove \
            "$CHROME_WINDOW" \
            0 0

          xdotool windowsize \
            "$CHROME_WINDOW" \
            1080 1920

          sleep 3

          echo "Chrome geometry:"
          xdotool getwindowgeometry "$CHROME_WINDOW"

          echo "Display geometry:"
          xdpyinfo -display :99 | grep dimensions

          # Click inside the webpage.
          xdotool mousemove 540 960
          xdotool click 1

          sleep 3

      # ---------------------------------------------------------
      # 6. Stream to Restream
      # ---------------------------------------------------------
      - name: Stream to Restream
        run: |
          set -euo pipefail

          RESTREAM_URL="rtmp://london.restream.io/live"

          # QUICK TEST KEY
          RESTREAM_KEY="re_12262857_eventb998ec2e79c64f8e978759c2b52fe02c"

          TARGET="${RESTREAM_URL%/}/${RESTREAM_KEY}"

          echo "========================================"
          echo "PUBLIC WEBSITE RESTREAM TEST"
          echo "========================================"
          echo "Website: https://www.wikipedia.org/"
          echo "Server: $RESTREAM_URL"
          echo "Resolution: 1080x1920"
          echo "FPS: 30"
          echo "Duration: 3 minutes"
          echo "========================================"

          ffmpeg \
            -hide_banner \
            -loglevel info \
            -f x11grab \
            -video_size 1080x1920 \
            -framerate 30 \
            -draw_mouse 0 \
            -i :99.0 \
            -f pulse \
            -i TikTokSink.monitor \
            -map 0:v:0 \
            -map 1:a:0 \
            -c:v libx264 \
            -preset ultrafast \
            -tune zerolatency \
            -pix_fmt yuv420p \
            -r 30 \
            -b:v 2500k \
            -maxrate 3000k \
            -bufsize 6000k \
            -g 60 \
            -keyint_min 60 \
            -sc_threshold 0 \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -ac 2 \
            -t 180 \
            -f flv \
            "$TARGET"
