name: Public Website 3-Minute Restream Test

"on":
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      # =========================================================
      # 1. Install dependencies
      # =========================================================
      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            xvfb \
            openbox \
            xdotool \
            pulseaudio \
            pulseaudio-utils \
            wget \
            x11-utils \
            imagemagick

      # =========================================================
      # 2. Install Google Chrome
      # =========================================================
      - name: Install Google Chrome
        run: |
          set -eux

          wget -O /tmp/chrome.deb \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb

          sudo apt-get install -y /tmp/chrome.deb

          google-chrome --version

      # =========================================================
      # 3. Start virtual display + window manager
      # =========================================================
      - name: Start virtual display
        run: |
          set -eux

          export DISPLAY=:99

          Xvfb :99 \
            -screen 0 1080x1920x24 \
            -ac \
            +extension GLX \
            +render \
            -noreset &

          sleep 4

          echo "Virtual display:"
          xdpyinfo -display :99 | grep dimensions

          # Start Openbox so Chrome can be maximized reliably.
          openbox \
            --config-file /etc/xdg/openbox/rc.xml \
            >/tmp/openbox.log 2>&1 &

          sleep 3

          echo "Openbox:"
          pgrep -a openbox || true

      # =========================================================
      # 4. Start virtual audio
      # =========================================================
      - name: Start virtual audio
        run: |
          set -eux

          pulseaudio \
            --start \
            --exit-idle-time=-1

          sleep 3

          # Create a virtual sink for Chrome audio.
          pactl load-module \
            module-null-sink \
            sink_name=TikTokSink \
            sink_properties=device.description=TikTokSink

          pactl set-default-sink TikTokSink

          echo "Audio sinks:"
          pactl list short sinks

          echo "Audio sources:"
          pactl list short sources

      # =========================================================
      # 5. Launch public webpage
      # =========================================================
      - name: Launch public webpage
        run: |
          set -eux

          export DISPLAY=:99

          WEBSITE_URL="https://livespherev3.gamer.gd/?i=1"

          echo "Launching:"
          echo "$WEBSITE_URL"

          google-chrome \
            --no-sandbox \
            --disable-dev-shm-usage \
            --no-first-run \
            --no-default-browser-check \
            --disable-infobars \
            --autoplay-policy=no-user-gesture-required \
            --force-device-scale-factor=1 \
            --window-size=1080,1920 \
            --window-position=0,0 \
            --user-data-dir=/tmp/chrome-profile \
            --ignore-certificate-errors \
            --enable-webgl \
            --enable-gpu-rasterization \
            --enable-zero-copy \
            "$WEBSITE_URL" &

          echo "Waiting for Chrome and webpage..."
          sleep 15

          echo "Chrome windows:"
          xdotool search \
            --onlyvisible \
            --class "google-chrome" \
            getwindowgeometry %@ || true

          CHROME_WINDOW=$(xdotool search \
            --onlyvisible \
            --class "google-chrome" \
            | head -n 1)

          if [ -z "$CHROME_WINDOW" ]; then
            echo "ERROR: Chrome window not found"
            exit 1
          fi

          echo "Chrome window ID: $CHROME_WINDOW"

          # Move Chrome to the top-left corner.
          xdotool windowmove \
            "$CHROME_WINDOW" \
            0 0

          sleep 2

          # Maximize using Openbox.
          xdotool key \
            --window "$CHROME_WINDOW" \
            alt+F10

          sleep 10

          echo "FINAL Chrome geometry:"
          xdotool getwindowgeometry \
            "$CHROME_WINDOW"

          echo "FINAL display geometry:"
          xdpyinfo -display :99 | grep dimensions

          # -----------------------------------------------------
          # Give the webpage time to initialize.
          # -----------------------------------------------------
          sleep 5

          # -----------------------------------------------------
          # Real mouse interaction.
          #
          # The webpage does not have a button, but its audio
          # requires a browser user gesture. Clicking the page
          # provides that gesture.
          # -----------------------------------------------------
          echo "Sending first webpage click..."

          xdotool mousemove 540 960
          xdotool click 1

          sleep 2

          echo "Sending second webpage click..."

          xdotool mousemove 540 960
          xdotool click 1

          sleep 5

          echo "PulseAudio sink inputs after webpage interaction:"
          pactl list short sink-inputs || true

      # =========================================================
      # 6. Capture exactly what FFmpeg will see
      # =========================================================
      - name: Verify webpage before streaming
        run: |
          set -eux

          export DISPLAY=:99

          echo "Capturing X display..."

          import \
            -display :99 \
            -window root \
            /tmp/webpage.png

          echo "Screenshot created:"
          ls -lh /tmp/webpage.png

          echo "Image information:"
          identify /tmp/webpage.png

          echo "Final PulseAudio sink inputs:"
          pactl list short sink-inputs || true

      # =========================================================
      # 7. Upload diagnostic screenshot
      # =========================================================
      - name: Upload webpage screenshot
        uses: actions/upload-artifact@v4
        with:
          name: webpage-preview
          path: /tmp/webpage.png
          if-no-files-found: error

      # =========================================================
      # 8. Stream to Restream
      # =========================================================
      - name: Stream to Restream
        run: |
          set -euo pipefail

          WEBSITE_URL="https://livespherev3.gamer.gd/?i=1"

          RESTREAM_URL="rtmp://london.restream.io/live"

          # QUICK TEST KEY
          RESTREAM_KEY="re_12262857_eventb998ec2e79c64f8e978759c2b52fe02c"

          TARGET="${RESTREAM_URL%/}/${RESTREAM_KEY}"

          echo "========================================"
          echo "PUBLIC WEBSITE RESTREAM TEST"
          echo "========================================"
          echo "Website:    $WEBSITE_URL"
          echo "Server:     $RESTREAM_URL"
          echo "Resolution: 1080x1920"
          echo "FPS:        30"
          echo "Duration:   3 minutes"
          echo "========================================"

          echo "PulseAudio sources:"
          pactl list short sources

          echo "PulseAudio sink inputs:"
          pactl list short sink-inputs || true

          echo "Starting FFmpeg..."

          ffmpeg \
            -hide_banner \
            -loglevel info \
            -f x11grab \
            -video_size 1080x1920 \
            -framerate 30 \
            -draw_mouse 0 \
            -i :99.0 \
            -f pulse \
            -i TikTokSink.monitor \
            -map 0:v:0 \
            -map 1:a:0 \
            -c:v libx264 \
            -preset ultrafast \
            -tune zerolatency \
            -pix_fmt yuv420p \
            -r 30 \
            -b:v 2500k \
            -maxrate 3000k \
            -bufsize 6000k \
            -g 60 \
            -keyint_min 60 \
            -sc_threshold 0 \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -ac 2 \
            -t 180 \
            -f flv \
            "$TARGET"
