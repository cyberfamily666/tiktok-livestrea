name: LiveSphere TikTok 30 Minute Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:

      - name: Install streaming software
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            xvfb \
            xdotool \
            pulseaudio \
            pulseaudio-utils \
            wget

      - name: Install Google Chrome
        run: |
          set -euxo pipefail

          wget -O /tmp/chrome.deb \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb

          sudo apt-get install -y /tmp/chrome.deb

          google-chrome --version

      - name: Start TikTok portrait display
        run: |
          set -euxo pipefail

          export DISPLAY=:99

          Xvfb :99 \
            -screen 0 1080x1920x24 \
            -ac \
            +extension GLX \
            +render \
            -noreset \
            > /tmp/xvfb.log 2>&1 &

          echo $! > /tmp/xvfb.pid

          sleep 4

          xdpyinfo | grep dimensions

      - name: Start audio system
        run: |
          set -euxo pipefail

          pulseaudio \
            --start \
            --exit-idle-time=-1

          sleep 3

          pactl load-module \
            module-null-sink \
            sink_name=TikTokAudio \
            sink_properties=device.description=TikTokAudio

          pactl set-default-sink TikTokAudio

          echo "Audio sinks:"
          pactl list short sinks

          echo "Audio sources:"
          pactl list short sources

      - name: Open LiveSphere
        run: |
          set -euxo pipefail

          export DISPLAY=:99

          google-chrome \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --disable-software-rasterizer \
            --disable-infobars \
            --disable-notifications \
            --disable-session-crashed-bubble \
            --autoplay-policy=no-user-gesture-required \
            --start-fullscreen \
            --kiosk \
            --window-size=1080,1920 \
            --window-position=0,0 \
            --force-device-scale-factor=1 \
            --user-data-dir=/tmp/livesphere-profile \
            "https://livespherev3.gamer.gd/?i=1" \
            > /tmp/chrome.log 2>&1 &

          echo $! > /tmp/chrome.pid

          echo "Waiting for LiveSphere to load..."
          sleep 15

          echo "Chrome processes:"
          pgrep -a chrome || true

      - name: Trigger LiveSphere sound
        run: |
          set -euxo pipefail

          export DISPLAY=:99

          echo "Triggering webpage interaction..."

          # Click the centre of the 1080x1920 portrait screen.
          xdotool mousemove 540 960
          xdotool click 1

          sleep 5

          echo "Chrome audio connections:"
          pactl list short sink-inputs || true

      - name: Start 30 minute TikTok stream
        run: |
          set -euo pipefail

          # --------------------------------------------
          # RESTREAM
          # --------------------------------------------
          RESTREAM_URL="rtmp://london.restream.io/live"

          # Put the NEW Restream key here.
          RESTREAM_KEY="re_12262857_eventb998ec2e79c64f8e978759c2b52fe02c"

          TARGET="${RESTREAM_URL%/}/${RESTREAM_KEY}"

          echo "=============================================="
          echo "      LIVE SPHERE TIKTOK STREAM"
          echo "=============================================="
          echo "Resolution : 1080x1920"
          echo "Orientation: Portrait 9:16"
          echo "Frame rate : 30 FPS"
          echo "Duration   : 30 MINUTES"
          echo "Audio      : PulseAudio"
          echo "Website    : LiveSphere"
          echo "Destination: London Restream RTMP"
          echo "=============================================="

          ffmpeg \
            -hide_banner \
            -loglevel info \
            -f x11grab \
            -video_size 1080x1920 \
            -framerate 30 \
            -draw_mouse 0 \
            -i :99.0 \
            -f pulse \
            -i TikTokAudio.monitor \
            -map 0:v:0 \
            -map 1:a:0 \
            -c:v libx264 \
            -preset ultrafast \
            -tune zerolatency \
            -pix_fmt yuv420p \
            -r 30 \
            -b:v 2500k \
            -maxrate 3000k \
            -bufsize 6000k \
            -g 60 \
            -keyint_min 60 \
            -sc_threshold 0 \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -ac 2 \
            -t 1800 \
            -f flv \
            "$TARGET"

      - name: Cleanup
        if: always()
        run: |
          kill "$(cat /tmp/chrome.pid)" 2>/dev/null || true
          kill "$(cat /tmp/xvfb.pid)" 2>/dev/null || true
          pulseaudio --kill 2>/dev/null || true
