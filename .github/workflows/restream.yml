```yaml
name: Public Website 3-Minute Restream Test

"on":
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DISPLAY: :99
      PULSE_SINK: TikTokSink

    steps:

      # =========================================================
      # 1. INSTALL DEPENDENCIES
      # =========================================================
      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            xvfb \
            openbox \
            xdotool \
            pulseaudio \
            pulseaudio-utils \
            wget \
            x11-utils \
            imagemagick \
            curl \
            jq \
            python3 \
            python3-pip

      # =========================================================
      # 2. INSTALL GOOGLE CHROME
      # =========================================================
      - name: Install Google Chrome
        run: |
          set -eux

          wget -O /tmp/chrome.deb \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb

          sudo apt-get install -y /tmp/chrome.deb

          google-chrome --version

      # =========================================================
      # 3. START X SERVER
      # =========================================================
      - name: Start virtual display
        run: |
          set -eux

          export DISPLAY=:99

          echo "Starting Xvfb..."

          Xvfb :99 \
            -screen 0 1080x1920x24 \
            -ac \
            +extension GLX \
            +extension RANDR \
            +render \
            -noreset \
            >/tmp/xvfb.log 2>&1 &

          sleep 5

          echo "Checking display..."

          xdpyinfo -display :99 | grep dimensions

          echo "Disabling screen blanking..."

          xset -display :99 s off || true
          xset -display :99 -dpms || true
          xset -display :99 s noblank || true

          echo "Starting Openbox..."

          openbox \
            --config-file /etc/xdg/openbox/rc.xml \
            >/tmp/openbox.log 2>&1 &

          sleep 4

          echo "Openbox:"
          pgrep -a openbox || true

      # =========================================================
      # 4. START PULSEAUDIO
      # =========================================================
      - name: Start virtual audio
        run: |
          set -eux

          echo "Starting PulseAudio..."

          pulseaudio \
            --start \
            --exit-idle-time=-1 \
            --daemonize=true

          sleep 4

          echo "Creating virtual sink..."

          pactl load-module \
            module-null-sink \
            sink_name=TikTokSink \
            sink_properties=device.description=TikTokSink

          pactl set-default-sink TikTokSink

          echo "========================================"
          echo "AUDIO SINKS"
          echo "========================================"

          pactl list short sinks

          echo "========================================"
          echo "AUDIO SOURCES"
          echo "========================================"

          pactl list short sources

          echo "========================================"
          echo "DEFAULT SINK"
          echo "========================================"

          pactl get-default-sink

          echo "========================================"
          echo "MONITOR"
          echo "========================================"

          pactl list short sources | grep "TikTokSink.monitor"

      # =========================================================
      # 5. LAUNCH CHROME
      # =========================================================
      - name: Launch Chrome renderer
        run: |
          set -eux

          export DISPLAY=:99
          export PULSE_SINK=TikTokSink

          rm -rf /tmp/chrome-profile

          echo "Launching Chrome..."

          google-chrome \
            --no-sandbox \
            --disable-dev-shm-usage \
            --no-first-run \
            --no-default-browser-check \
            --disable-infobars \
            --disable-session-crashed-bubble \
            --disable-popup-blocking \
            --disable-translate \
            \
            --autoplay-policy=no-user-gesture-required \
            \
            --enable-javascript \
            --allow-running-insecure-content \
            \
            --disable-background-timer-throttling \
            --disable-backgrounding-occluded-windows \
            --disable-renderer-backgrounding \
            --disable-features=CalculateNativeWinOcclusion,IntensiveWakeUpThrottling,BackForwardCache \
            \
            --enable-webgl \
            --enable-gpu-rasterization \
            --enable-zero-copy \
            \
            --force-device-scale-factor=1 \
            --window-size=1080,1920 \
            --window-position=0,0 \
            --start-maximized \
            --kiosk \
            \
            --remote-debugging-port=9222 \
            --remote-debugging-address=127.0.0.1 \
            \
            --user-data-dir=/tmp/chrome-profile \
            --ignore-certificate-errors \
            \
            "https://livespherev3.gamer.gd/?i=1" \
            >/tmp/chrome.log 2>&1 &

          echo "Waiting for Chrome DevTools..."

          for i in $(seq 1 30); do

            if curl -fsS \
              http://127.0.0.1:9222/json \
              >/tmp/chrome-tabs.json; then

              echo "Chrome DevTools ready."
              break

            fi

            sleep 1

          done

          if [ ! -s /tmp/chrome-tabs.json ]; then
            echo "Chrome DevTools did not start."

            cat /tmp/chrome.log || true

            exit 1
          fi

          cat /tmp/chrome-tabs.json

          echo "Waiting for webpage..."

          sleep 20

      # =========================================================
      # 6. FOCUS CHROME
      # =========================================================
      - name: Focus Chrome
        run: |
          set -eux

          export DISPLAY=:99

          CHROME_WINDOW=$(xdotool search \
            --onlyvisible \
            --class "google-chrome" \
            | head -n 1)

          if [ -z "$CHROME_WINDOW" ]; then

            echo "Chrome window not found."

            cat /tmp/chrome.log || true

            exit 1

          fi

          echo "Chrome window: $CHROME_WINDOW"

          xdotool windowmove \
            "$CHROME_WINDOW" \
            0 0 || true

          xdotool windowactivate \
            "$CHROME_WINDOW" || true

          sleep 3

          xdotool mousemove 540 960

          sleep 2

          xdotool click 1 || true

          sleep 5

          echo "Chrome geometry:"

          xdotool getwindowgeometry \
            "$CHROME_WINDOW" || true

      # =========================================================
      # 7. GET DEVTOOLS WEBSOCKET
      # =========================================================
      - name: Connect to Chrome DevTools
        run: |
          set -eux

          jq -r '
            .[]
            | select(.type=="page")
            | .webSocketDebuggerUrl
          ' /tmp/chrome-tabs.json \
            | head -n 1 \
            >/tmp/debug_url

          DEBUG_URL=$(cat /tmp/debug_url)

          if [ -z "$DEBUG_URL" ] || [ "$DEBUG_URL" = "null" ]; then

            echo "ERROR: DevTools websocket not found."

            cat /tmp/chrome-tabs.json

            exit 1

          fi

          echo "DevTools websocket found."

          echo "$DEBUG_URL"

      # =========================================================
      # 8. INSTALL PYTHON WEBSOCKET CLIENT
      # =========================================================
      - name: Install DevTools client
        run: |
          set -eux

          python3 -m pip install --quiet --break-system-packages websocket-client

      # =========================================================
      # 9. VERIFY JAVASCRIPT EXECUTION
      # =========================================================
      - name: Verify JavaScript renderer
        run: |
          set -eux

          cat >/tmp/test_js.py <<'PY'
          import json
          import time
          import websocket

          url = open("/tmp/debug_url").read().strip()

          print("Connecting to Chrome...")

          ws = websocket.create_connection(
              url,
              timeout=15
          )

          command_id = 0

          def command(method, params=None):

              global command_id

              command_id += 1

              message = {
                  "id": command_id,
                  "method": method
              }

              if params is not None:
                  message["params"] = params

              ws.send(json.dumps(message))

              while True:

                  response = json.loads(ws.recv())

                  if response.get("id") == command_id:
                      return response

          print("Activating page...")

          print(
              command(
                  "Page.setWebLifecycleState",
                  {
                      "state": "active"
                  }
              )
          )

          print("Enabling Runtime...")

          print(
              command(
                  "Runtime.enable"
              )
          )

          print("Testing JavaScript...")

          expression = r"""
          (() => {

              window.__GitHubRendererProbe = {
                  executed: true,
                  timestamp: Date.now(),
                  raf: typeof requestAnimationFrame === "function",
                  performance: typeof performance !== "undefined",
                  document: typeof document !== "undefined",
                  visibility: document.visibilityState,
                  hidden: document.hidden,
                  readyState: document.readyState,
                  url: location.href,
                  scripts: document.scripts.length,
                  canvases: document.querySelectorAll("canvas").length,
                  viewers: document.querySelectorAll(".viewer").length,
                  audio: document.querySelectorAll("audio").length,
                  video: document.querySelectorAll("video").length
              };

              return window.__GitHubRendererProbe;

          })()
          """

          result = command(
              "Runtime.evaluate",
              {
                  "expression": expression,
                  "returnByValue": True,
                  "awaitPromise": True
              }
          )

          print("========================================")
          print("JAVASCRIPT RESULT")
          print("========================================")

          print(
              json.dumps(
                  result,
                  indent=2
              )
          )

          print("Waiting five seconds...")

          time.sleep(5)

          expression2 = r"""
          (() => ({

              executedAgain: true,

              timestamp: Date.now(),

              visibility: document.visibilityState,

              hidden: document.hidden,

              engineRunning:
                  window.__LiveSphereEngineRunning ?? null,

              frameCounter:
                  window.__LiveSphereFrameCounter ?? null,

              stageInitialized:
                  window.__LiveSphereStageInitialized ?? null,

              viewers:
                  document.querySelectorAll(".viewer").length,

              canvases:
                  document.querySelectorAll("canvas").length,

              audio:
                  document.querySelectorAll("audio").length

          }))()
          """

          result2 = command(
              "Runtime.evaluate",
              {
                  "expression": expression2,
                  "returnByValue": True,
                  "awaitPromise": True
              }
          )

          print("========================================")
          print("JAVASCRIPT RESULT AFTER 5 SECONDS")
          print("========================================")

          print(
              json.dumps(
                  result2,
                  indent=2
              )
          )

          ws.close()
          PY

          python3 /tmp/test_js.py

      # =========================================================
      # 10. FORCE ACTIVE PAGE LIFECYCLE
      # =========================================================
      - name: Keep Chrome page active
        run: |
          set -eux

          cat >/tmp/activate_page.py <<'PY'
          import json
          import time
          import websocket

          url = open("/tmp/debug_url").read().strip()

          ws = websocket.create_connection(
              url,
              timeout=15
          )

          command_id = 0

          def command(method, params=None):

              global command_id

              command_id += 1

              msg = {
                  "id": command_id,
                  "method": method
              }

              if params is not None:
                  msg["params"] = params

              ws.send(json.dumps(msg))

              while True:

                  response = json.loads(ws.recv())

                  if response.get("id") == command_id:
                      return response

          print(
              command(
                  "Page.setWebLifecycleState",
                  {
                      "state": "active"
                  }
              )
          )

          print(
              command(
                  "Emulation.setFocusEmulationEnabled",
                  {
                      "enabled": True
                  }
              )
          )

          print(
              command(
                  "Runtime.evaluate",
                  {
                      "expression": """
                      (() => ({
                          visibility: document.visibilityState,
                          hidden: document.hidden,
                          hasRAF:
                              typeof requestAnimationFrame === "function"
                      }))()
                      """,
                      "returnByValue": True
                  }
              )
          )

          ws.close()
          PY

          python3 /tmp/activate_page.py

      # =========================================================
      # 11. WARM UP WEBSITE
      # =========================================================
      - name: Warm up renderer
        run: |
          set -eux

          export DISPLAY=:99

          echo "Giving JavaScript renderer time to run..."

          sleep 20

          echo "Chrome processes:"

          pgrep -a chrome || true

          echo "Display:"

          xdpyinfo -display :99 | grep dimensions

      # =========================================================
      # 12. CAPTURE TWO FRAMES
      # =========================================================
      - name: Capture diagnostic frames
        run: |
          set -eux

          export DISPLAY=:99

          echo "Capturing frame 1..."

          import \
            -display :99 \
            -window root \
            /tmp/webpage-before.png

          sleep 3

          echo "Capturing frame 2..."

          import \
            -display :99 \
            -window root \
            /tmp/webpage-after.png

          echo "Images:"

          identify \
            /tmp/webpage-before.png \
            /tmp/webpage-after.png

      # =========================================================
      # 13. UPLOAD DIAGNOSTICS
      # =========================================================
      - name: Upload renderer diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: renderer-diagnostics
          path: |
            /tmp/webpage-before.png
            /tmp/webpage-after.png
            /tmp/chrome.log
            /tmp/xvfb.log
            /tmp/openbox.log
          if-no-files-found: error

      # =========================================================
      # 14. VERIFY AUDIO
      # =========================================================
      - name: Verify audio pipeline
        run: |
          set -eux

          echo "========================================"
          echo "PULSEAUDIO SINKS"
          echo "========================================"

          pactl list short sinks

          echo "========================================"
          echo "PULSEAUDIO SOURCES"
          echo "========================================"

          pactl list short sources

          echo "========================================"
          echo "DEFAULT SINK"
          echo "========================================"

          pactl get-default-sink

          echo "========================================"
          echo "AUDIO LEVEL TEST"
          echo "========================================"

          timeout 5 ffmpeg \
            -hide_banner \
            -loglevel info \
            -f pulse \
            -i TikTokSink.monitor \
            -af volumedetect \
            -f null \
            - \
            2>&1 \
            | tee /tmp/audio-test.log || true

          echo "========================================"
          echo "AUDIO TEST RESULT"
          echo "========================================"

          cat /tmp/audio-test.log || true

      # =========================================================
      # 15. FINAL RESTREAM
      # =========================================================
      - name: Stream to Restream
        run: |
          set -euo pipefail

          export DISPLAY=:99
          export PULSE_SINK=TikTokSink

          RESTREAM_URL="rtmp://london.restream.io/live"

          RESTREAM_KEY="re_12262857_eventb998ec2e79c64f8e978759c2b52fe02c"

          TARGET="${RESTREAM_URL%/}/${RESTREAM_KEY}"

          echo "========================================"
          echo "PUBLIC WEBSITE RESTREAM TEST"
          echo "========================================"
          echo "Website: https://livespherev3.gamer.gd/?i=1"
          echo "Resolution: 1080x1920"
          echo "FPS: 30"
          echo "Duration: 3 minutes"
          echo "========================================"

          echo "Checking display..."

          xdpyinfo -display :99 | grep dimensions

          echo "Checking audio..."

          pactl list short sources | grep "TikTokSink.monitor"

          echo "Starting FFmpeg..."

          ffmpeg \
            -hide_banner \
            -loglevel info \
            \
            -f x11grab \
            -draw_mouse 0 \
            -framerate 30 \
            -video_size 1080x1920 \
            -i :99.0 \
            \
            -f pulse \
            -i TikTokSink.monitor \
            \
            -map 0:v:0 \
            -map 1:a:0 \
            \
            -c:v libx264 \
            -preset ultrafast \
            -tune zerolatency \
            -pix_fmt yuv420p \
            \
            -r 30 \
            -b:v 2500k \
            -maxrate 3000k \
            -bufsize 6000k \
            \
            -g 60 \
            -keyint_min 60 \
            -sc_threshold 0 \
            \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -ac 2 \
            \
            -t 180 \
            \
            -f flv \
            "$TARGET"
```
